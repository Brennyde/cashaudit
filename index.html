<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Cash Audits"><link rel="manifest" href="manifest.webmanifest"><title>Cash Audit Tracker</title><style>:root{color-scheme:light dark;--bg:#f3f5f7;--card:#fff;--text:#17202a;--muted:#667085;--line:#d0d5dd;--brand:#075dcc;--danger:#b42318;--dangerbg:#fee4e2;--warn:#b54708;--warnbg:#fffaeb;--ok:#027a48;--okbg:#ecfdf3}@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#151f2e;--text:#f2f4f7;--muted:#98a2b3;--line:#344054;--brand:#6aa5ff;--danger:#f97066;--dangerbg:#4a1f22;--warn:#fdb022;--warnbg:#3b2d11;--ok:#32d583;--okbg:#123325}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.wrap{max-width:760px;margin:auto;padding:20px 16px 30px}h1{font-size:26px;margin:0}.sub{color:var(--muted);font-size:14px;margin:3px 0 18px}.panel,.store{background:var(--card);border:1px solid var(--line);border-radius:16px}.panel{padding:14px;margin-bottom:16px}.add{display:grid;grid-template-columns:1fr auto;gap:10px}.add input{padding:13px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--text)}button{border:0;border-radius:11px;padding:12px 14px;font-weight:700}.primary{background:var(--brand);color:white}.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.complete{background:var(--ok);color:white;flex:1}.delete{background:transparent;color:var(--danger);border:1px solid currentColor}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.summary div{padding:10px;border-radius:10px;background:var(--bg);text-align:center}.summary b{display:block;font-size:19px}.summary span{font-size:12px;color:var(--muted)}#list{display:grid;gap:12px}.store{padding:15px;border-left:7px solid var(--ok)}.store.warning,.store.overdue{border-left-color:var(--danger);background:var(--dangerbg)}.store.never{border-left-color:var(--warn);background:var(--warnbg)}.top{display:flex;justify-content:space-between;gap:8px}.name{font-size:19px;font-weight:800}.badge{white-space:nowrap;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:var(--okbg);color:var(--ok)}.warning .badge,.overdue .badge{background:var(--danger);color:white}.never .badge{background:var(--warn);color:white}.dates{color:var(--muted);font-size:14px;line-height:1.55;margin:10px 0}.actions{display:flex;gap:8px}.empty{text-align:center;color:var(--muted);padding:30px}.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.tools button{font-size:13px;padding:9px 11px}#msg{min-height:20px;color:var(--danger);font-size:13px;margin-top:7px}.hidden{display:none}@media(max-width:500px){.add{grid-template-columns:1fr}.actions{flex-direction:column}.actions button{width:100%}}</style></head><body><main class="wrap"><h1>Cash Audit Tracker</h1><div class="sub">30-day cycle · red when 7 days remain</div><section class="panel"><form id="addForm" class="add"><input id="storeName" maxlength="60" placeholder="Add store (e.g. G102)" autocomplete="off"><button class="primary" type="submit">Add store</button></form><div id="msg"></div><div class="summary"><div><b id="total">0</b><span>Stores</span></div><div><b id="dueSoon">0</b><span>Due soon</span></div><div><b id="overdue">0</b><span>Overdue</span></div></div><div class="tools"><button id="exportBtn" class="ghost" type="button">Export backup</button><button id="importBtn" class="ghost" type="button">Import backup</button><input id="importFile" class="hidden" type="file" accept="application/json"></div></section><section id="list" aria-live="polite"></section></main><script>(()=>{const KEY='cash-audit-tracker-v1',DAY=86400000,DEADLINE=30,RED_AT=7,$=id=>document.getElementById(id);let stores=load();function load(){try{let v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[]}catch{return[]}}function save(){localStorage.setItem(KEY,JSON.stringify(stores));render()}function today(){let d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}function parseDate(s){if(!s)return null;let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}function dateKey(d=new Date()){return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function fmt(d){return new Intl.DateTimeFormat('en-AU',{day:'numeric',month:'short',year:'numeric'}).format(d)}function status(s){let last=parseDate(s.lastAudit);if(!last)return{kind:'never',label:'Audit required'};let used=Math.floor((today()-last)/DAY),left=DEADLINE-used,due=new Date(last.getTime()+DEADLINE*DAY);return{kind:left<0?'overdue':left<=RED_AT?'warning':'ok',label:left<0?`${Math.abs(left)} day${Math.abs(left)==1?'':'s'} overdue`:`${left} day${left==1?'':'s'} remaining`,due}}function esc(x){return String(x).replace(/[&<>']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;'}[c]))}function render(){stores.sort((a,b)=>{let A=status(a),B=status(b),r={overdue:0,warning:1,never:2,ok:3};return r[A.kind]-r[B.kind]||a.name.localeCompare(b.name)});$('list').innerHTML=stores.length?stores.map(s=>{let st=status(s),last=parseDate(s.lastAudit);return`<article class="store ${st.kind}"><div class="top"><div class="name">${esc(s.name)}</div><div class="badge">${esc(st.label)}</div></div><div class="dates">Last audit: <b>${last?fmt(last):'Not recorded'}</b>${st.due?`<br>30-day deadline: <b>${fmt(st.due)}</b>`:''}</div><div class="actions"><button class="complete" data-act="done" data-id="${s.id}" type="button">Audit complete today</button><button class="ghost" data-act="date" data-id="${s.id}" type="button">Set previous date</button><button class="delete" data-act="delete" data-id="${s.id}" type="button">Delete</button></div></article>`}).join(''):'<div class="panel empty">Add your first store above.</div>';let st=stores.map(status);$('total').textContent=stores.length;$('dueSoon').textContent=st.filter(x=>x.kind==='warning').length;$('overdue').textContent=st.filter(x=>x.kind==='overdue'||x.kind==='never').length}$('addForm').addEventListener('submit',e=>{e.preventDefault();let name=$('storeName').value.trim();$('msg').textContent='';if(!name)return $('msg').textContent='Enter a store name.';if(stores.some(s=>s.name.toLowerCase()===name.toLowerCase()))return $('msg').textContent='That store is already in the list.';stores.push({id:Date.now().toString()+Math.random(),name,lastAudit:null});$('storeName').value='';save()});$('list').addEventListener('click',e=>{let b=e.target.closest('button[data-act]');if(!b)return;let s=stores.find(x=>x.id===b.dataset.id);if(b.dataset.act==='done'){if(confirm(`Mark ${s.name} audit complete today?`)){s.lastAudit=dateKey();save()}}else if(b.dataset.act==='date'){let v=prompt(`Enter last audit date for ${s.name} (YYYY-MM-DD):`,s.lastAudit||dateKey());if(v===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){alert('Use YYYY-MM-DD, for example 2026-11-01.');return}let d=parseDate(v);if(Number.isNaN(d.getTime())||dateKey(d)!==v||d>today()){alert('Enter a valid date that is not in the future.');return}s.lastAudit=v;save()}else if(confirm(`Delete ${s.name}?`)){stores=stores.filter(x=>x.id!==s.id);save()}});$('exportBtn').addEventListener('click',()=>{let blob=new Blob([JSON.stringify({version:1,stores},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`cash-audits-${dateKey()}.json`;a.click()});$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',async e=>{try{let data=JSON.parse(await e.target.files[0].text()),arr=Array.isArray(data)?data:data.stores;if(!Array.isArray(arr))throw 0;stores=arr.filter(x=>x&&typeof x.name==='string');save()}catch{$('msg').textContent='That backup file could not be imported.'}e.target.value=''});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});render()})();</script></body></html>
